[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ramma-nlp"
version = "0.1.0"
description = "Service interpreting natural-language ML monitoring requirements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.8.0",
    "pytest>=8.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
